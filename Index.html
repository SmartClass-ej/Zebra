<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>ЭЖ "Зебра" v1.0 (Firebase)</title>
<!-- Подключаем Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Tahoma,sans-serif;background:#fff;color:#2c2c2c;min-height:100vh}

  /* Loading Screen */
  .loading-screen{position:fixed;inset:0;background:#f5f7fa;z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .spinner{width:40px;height:40px;border:4px solid #e2e6ec;border-top-color:#2c3e50;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:15px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading-text{color:#6b7685;font-size:14px}

  .login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#f5f7fa,#e4e9f0)}
  .login-box{background:#fff;border:1px solid #d0d5dd;border-radius:8px;padding:40px 45px;width:420px;box-shadow:0 12px 32px rgba(0,0,0,.08)}
  .login-box h1{font-size:22px;color:#1f2d3d;text-align:center;margin-bottom:4px}
  .login-box .ver{text-align:center;color:#8a94a6;font-size:13px;margin-bottom:30px}
  .field{margin-bottom:18px}
  .field label{display:block;font-size:13px;color:#4a5568;margin-bottom:6px;font-weight:600}
  .field input,.field select{width:100%;padding:11px 14px;border:1px solid #cbd2dc;border-radius:5px;font-size:14px;transition:border-color .2s;background:#fff}
  .field input:focus,.field select:focus{outline:none;border-color:#2c3e50}
  .btn-login{display:block;width:100%;padding:12px;background:#2c3e50;color:#fff;border-radius:5px;font-size:15px;font-weight:500;cursor:pointer;margin-top:10px;text-align:center;text-decoration:none}
  .btn-login:hover{background:#1a252f}
  .error-msg{color:#c0392b;font-size:13px;text-align:center;margin-top:14px;min-height:18px}

  .app{display:none}.app.active{display:block}
  .navbar{background:#1f2d3d;color:#fff;padding:0 30px;display:flex;align-items:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .brand{padding:14px 25px 14px 0;margin-right:20px;border-right:1px solid #34495e}
  .brand .t{font-size:17px;font-weight:600}.brand .d{font-size:11px;color:#95a5b8;margin-top:2px}
  .nav-menu{display:flex;list-style:none;flex:1}
  .nav-menu>li{position:relative}
  .nav-menu>li>a{display:block;padding:18px 15px;color:#dce3eb;text-decoration:none;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .2s}
  .nav-menu>li>a:hover,.nav-menu>li.open>a{background:#2c3e50;color:#fff}
  .arrow{font-size:9px;margin-left:5px}
  .dropdown{display:none;position:absolute;top:100%;left:0;background:#fff;min-width:240px;border:1px solid #d0d5dd;border-top:none;box-shadow:0 6px 16px rgba(0,0,0,.1);list-style:none;z-index:200}
  .nav-menu>li.open .dropdown{display:block}
  .dropdown li a{display:block;padding:11px 18px;color:#2c3e50;text-decoration:none;font-size:13px;border-bottom:1px solid #f1f3f6;cursor:pointer}
  .dropdown li:last-child a{border-bottom:none}.dropdown li a:hover{background:#f5f7fa}
  .profile-link{margin-left:auto;padding:18px 15px;color:#dce3eb;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:8px;text-decoration:none}
  .profile-link:hover{color:#fff}
  .avatar{width:30px;height:30px;border-radius:50%;background:#2980b9;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}

  .content{padding:35px 40px;max-width:1400px;margin:0 auto}
  .page-title{font-size:24px;color:#1f2d3d;margin-bottom:8px}
  .page-sub{color:#6b7685;font-size:15px;margin-bottom:10px}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #e8ecf1;padding-bottom:16px;margin-bottom:24px}
  .page-head-left{flex:1}

  .card{background:#fff;border:1px solid #e2e6ec;border-radius:6px;padding:22px;margin-bottom:18px}
  .card h3{font-size:16px;color:#1f2d3d;margin-bottom:10px}
  .card p{font-size:14px;color:#4a5568;line-height:1.6}

  table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border:1px solid #e2e6ec;border-radius:6px;overflow:hidden}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid #e8ecf1}
  th{background:#f5f7fa;color:#1f2d3d;font-weight:600;font-size:13px}
  tbody tr:hover td{background:#fafbfc}
  .empty-row td{text-align:center;color:#8a94a6;padding:25px}

  .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin:28px 0 36px}
  .stat-card{background:#fff;border:1px solid #e2e6ec;border-radius:8px;padding:24px 22px;position:relative;overflow:hidden}
  .stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
  .stat-card.c1::before{background:#2980b9}.stat-card.c2::before{background:#27ae60}.stat-card.c3::before{background:#e67e22}.stat-card.c4::before{background:#8e44ad}
  .stat-num{font-size:34px;font-weight:700;color:#1f2d3d;line-height:1.1}
  .stat-label{font-size:13px;color:#6b7685;margin-top:6px;font-weight:500}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .section-title{font-size:18px;color:#1f2d3d;margin-bottom:14px;display:flex;align-items:center;gap:8px}
  .badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:600}
  .badge-green{background:#e8f5e9;color:#2e7d32}.badge-red{background:#fdecea;color:#c0392b}
  .muted{color:#a0a8b4;font-size:12px}

  .act-link{display:inline-block;border-radius:4px;padding:6px 11px;font-size:12px;cursor:pointer;font-weight:500;margin-right:6px;text-decoration:none}
  .act-edit{background:#eaf2fb;color:#2471a3}.act-edit:hover{background:#d6e6f7}
  .act-del{background:#fdecea;color:#c0392b}.act-del:hover{background:#fad7d3}

  .add-link{display:inline-block;padding:11px 20px;background:#2c3e50;color:#fff;border-radius:5px;font-size:14px;cursor:pointer;text-decoration:none;font-weight:500;white-space:nowrap}
  .add-link:hover{background:#1a252f}

  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,32,.55);z-index:500;align-items:center;justify-content:center}
  .modal-overlay.active{display:flex}
  .modal{background:#fff;width:600px;max-width:94%;max-height:90vh;overflow-y:auto;border-radius:10px;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:pop .25s ease}
  @keyframes pop{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-head{background:#1f2d3d;color:#fff;padding:22px 30px;display:flex;justify-content:space-between;align-items:center;border-radius:10px 10px 0 0}
  .modal-head h2{font-size:19px;font-weight:600}
  .modal-close{cursor:pointer;font-size:26px;line-height:1;color:#95a5b8;transition:color .2s;text-decoration:none}
  .modal-close:hover{color:#fff}
  .modal-body{padding:30px}
  .modal-body .field{margin-bottom:20px}
  .modal-note{font-size:12px;color:#8a94a6;margin-top:5px}
  .modal-foot{padding:0 30px 30px;display:flex;justify-content:flex-end;gap:12px}
  .btn-cancel{display:inline-block;padding:11px 22px;background:#f1f3f6;color:#4a5568;border-radius:5px;font-size:14px;cursor:pointer;text-decoration:none}
  .btn-cancel:hover{background:#e4e8ee}
  .btn-save{display:inline-block;padding:11px 26px;background:#2c3e50;color:#fff;border-radius:5px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none}
  .btn-save:hover{background:#1a252f}
  .btn-add-period{display:inline-block;padding:8px 16px;background:#eaf2fb;color:#2471a3;border-radius:5px;font-size:13px;cursor:pointer;text-decoration:none;font-weight:500;margin-bottom:15px}
  .btn-add-period:hover{background:#d6e6f7}
  .period-row{display:flex;gap:12px;align-items:center;margin-bottom:10px;padding:10px;background:#f9fafb;border-radius:5px;border:1px solid #e8ecf1}
  .period-row .field{margin-bottom:0;flex:1}
  .period-remove{color:#c0392b;cursor:pointer;text-decoration:none;font-size:18px;font-weight:bold;padding:0 5px}

  .assign-form{background:#f9fafb;border:1px solid #e2e6ec;border-radius:6px;padding:22px;margin-bottom:24px;display:flex;gap:15px;align-items:flex-end;flex-wrap:wrap}
  .assign-form .field{margin-bottom:0;flex:1;min-width:180px}
  .assign-form .btn-assign{display:inline-block;padding:11px 22px;background:#27ae60;color:#fff;border-radius:5px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;height:42px;line-height:20px}
  .assign-form .btn-assign:hover{background:#219a52}

  .color-swatch{display:inline-block;width:22px;height:22px;border-radius:4px;vertical-align:middle;border:1px solid #d0d5dd;margin-right:8px}
  input[type="color"]{height:42px;padding:4px;cursor:pointer}

  .bell-row{display:flex;gap:15px;align-items:center;margin-bottom:12px;padding:14px;background:#f9fafb;border-radius:6px;border:1px solid #e8ecf1}
  .bell-row .field{margin-bottom:0;flex:1}
  .bell-num{font-weight:700;color:#1f2d3d;min-width:80px;font-size:14px}
  .bell-remove{color:#c0392b;cursor:pointer;text-decoration:none;font-size:20px;font-weight:bold;padding:0 5px}
  .bell-actions{margin-top:20px;display:flex;gap:12px}

  .schedule-select{margin-bottom:24px;display:flex;gap:15px;align-items:flex-end}
  .schedule-select .field{margin-bottom:0;min-width:250px}
  .schedule-table{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid #e2e6ec}
  .schedule-table th{background:#1f2d3d;color:#fff;padding:10px 8px;text-align:center;font-size:12px;font-weight:600}
  .schedule-table td{padding:6px;border:1px solid #e2e6ec;vertical-align:top}
  .schedule-table .lesson-cell{min-width:150px}
  .schedule-table select{width:100%;padding:6px 8px;border:1px solid #cbd2dc;border-radius:4px;font-size:12px;background:#fff;margin-bottom:4px}
  .schedule-table .time-label{font-size:11px;color:#8a94a6;text-align:center;white-space:nowrap}
  .publish-bar{margin-top:20px;text-align:right}

  /* ===== КЛАССНЫЙ ЖУРНАЛ ===== */
  .journal-filters{display:flex;gap:15px;align-items:flex-end;flex-wrap:wrap;margin-bottom:24px;background:#f9fafb;padding:20px;border-radius:6px;border:1px solid #e2e6ec}
  .journal-filters .field{margin-bottom:0;flex:1;min-width:200px}
  .journal-filters .btn-open{display:inline-block;padding:11px 26px;background:#2c3e50;color:#fff;border-radius:5px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;height:42px;line-height:20px}
  .journal-filters .btn-open:hover{background:#1a252f}
  
  .journal-toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
  .plan-btn{display:inline-block;padding:10px 20px;background:#8e44ad;color:#fff;border-radius:5px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none}
  .plan-btn:hover{background:#732d91}

  .journal-wrap{overflow-x:auto;margin-top:20px;border:1px solid #d0d5dd;border-radius:6px;background:#fff}
  .journal-table{border-collapse:collapse;font-size:12px;width:max-content;min-width:100%}
  .journal-table th,.journal-table td{border:1px solid #d0d5dd;padding:0;text-align:center;vertical-align:middle}
  
  .journal-table thead .header-month{background:#1f2d3d;color:#fff;font-size:11px;font-weight:600;padding:6px 4px;text-transform:uppercase;letter-spacing:.3px}
  .journal-table thead .header-date{background:#2c3e50;color:#fff;font-size:10px;font-weight:600;padding:4px 2px;min-width:28px}
  .journal-table thead .header-sticky{position:sticky;left:0;z-index:3;background:#1f2d3d;color:#fff;padding:6px 10px;text-align:left;font-size:11px;font-weight:600;min-width:180px}
  .journal-table thead .header-num{position:sticky;left:0;z-index:3;background:#1f2d3d;color:#fff;padding:6px 4px;font-size:11px;font-weight:600;min-width:30px;text-align:center}
  .journal-table thead .header-type-label{position:sticky;left:0;z-index:3;background:#f5f7fa;color:#6b7685;font-size:10px;font-weight:600;padding:4px 10px;text-align:left;min-width:180px}
  .journal-table thead .header-type-num{position:sticky;left:0;z-index:3;background:#f5f7fa;color:#6b7685;font-size:10px;font-weight:600;padding:4px 4px;min-width:30px;text-align:center}

  .journal-table .type-cell-view{background:#f5f7fa;padding:0;min-width:28px;height:24px;font-size:10px;font-weight:600;color:#6b7685}
  
  .journal-table .grade-cell{width:28px;min-width:28px;height:26px;padding:0;cursor:pointer;position:relative}
  .journal-table .grade-cell:hover{background:#eaf2fb}
  .journal-table .grade-cell .grade-val{font-size:11px;font-weight:600;padding:2px;display:block;width:100%;height:100%;line-height:22px}
  .journal-table .grade-cell input.grade-input{width:100%;height:100%;border:none;text-align:center;font-size:11px;font-weight:600;padding:0;background:#fffbeb;outline:2px solid #f39c12}
  .journal-table .grade-absent{background:#fee2e2 !important;color:#991b1b !important;font-weight:700;}

  .journal-table .avg-cell{min-width:50px;padding:4px 8px;font-weight:700;font-size:12px;background:#f0fdf4;color:#166534;position:sticky;right:50px;z-index:1}
  .journal-table .final-cell{min-width:50px;padding:0;position:sticky;right:0;z-index:1;background:#fefce8}
  .journal-table .final-cell input.final-input{width:100%;height:100%;border:none;text-align:center;font-size:12px;font-weight:700;padding:4px;background:#fefce8;outline:2px solid #f39c12}
  .journal-table .final-cell .final-val{font-size:12px;font-weight:700;padding:4px;display:block;width:100%;line-height:18px;cursor:pointer}
  .journal-table .final-cell .final-val:hover{background:#fef3c7}

  .journal-table .student-name{position:sticky;left:30px;z-index:1;text-align:left;padding:4px 10px;white-space:nowrap;font-size:12px;min-width:180px;background:#fafbfc}
  .journal-table .num-col{position:sticky;left:0;z-index:1;min-width:30px;padding:4px;background:#fafbfc;font-weight:600;color:#6b7685;text-align:center}

  .saved-flash{animation:flashGreen .6s ease}
  @keyframes flashGreen{0%{background:#bbf7d0}100%{background:transparent}}

  /* ===== ПОУРОЧНОЕ ПЛАНИРОВАНИЕ ===== */
  .planning-container{margin-top:20px}
  .planning-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:2px solid #e8ecf1}
  .back-link{display:inline-flex;align-items:center;gap:5px;color:#2c3e50;text-decoration:none;font-size:14px;font-weight:500;cursor:pointer}
  .back-link:hover{color:#1a252f}
  
  .planning-list{display:flex;flex-direction:column;gap:15px}
  .planning-item{background:#fff;border:1px solid #e2e6ec;border-radius:8px;padding:20px;box-shadow:0 2px 4px rgba(0,0,0,.02)}
  .planning-item-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;border-bottom:1px dashed #e8ecf1}
  .planning-date{font-size:16px;font-weight:700;color:#1f2d3d}
  .planning-weekday{font-size:13px;color:#6b7685;margin-left:10px}
  
  .planning-fields{display:grid;grid-template-columns:1fr 1fr;gap:15px}
  .planning-field-group{display:flex;flex-direction:column}
  .planning-field-group.full-width{grid-column:1/-1}
  .planning-label{font-size:12px;font-weight:600;color:#4a5568;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
  .planning-input,.planning-textarea,.planning-select{
    width:100%;padding:10px 12px;border:1px solid #cbd2dc;border-radius:5px;font-size:14px;background:#fafbfc;transition:border-color .2s,background .2s
  }
  .planning-input:focus,.planning-textarea:focus,.planning-select:focus{outline:none;border-color:#2c3e50;background:#fff}
  .planning-textarea{resize:vertical;min-height:80px;font-family:inherit}
  
  .planning-type-display{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:600;background:#f5f7fa;color:#4a5568;border:1px solid #e2e6ec}
  .planning-type-dot{width:10px;height:10px;border-radius:50%;display:inline-block}

  /* ===== ЖУРНАЛ ПОСЕЩАЕМОСТИ ===== */
  .attendance-filters{display:flex;gap:15px;align-items:flex-end;flex-wrap:wrap;margin-bottom:24px;background:#f9fafb;padding:20px;border-radius:6px;border:1px solid #e2e6ec}
  .attendance-filters .field{margin-bottom:0;flex:1;min-width:200px}
  .attendance-filters .btn-open{display:inline-block;padding:11px 26px;background:#2c3e50;color:#fff;border-radius:5px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap;height:42px;line-height:20px}
  .attendance-filters .btn-open:hover{background:#1a252f}

  .att-wrap{overflow-x:auto;margin-top:20px;border:1px solid #d0d5dd;border-radius:6px;background:#fff}
  .att-table{border-collapse:collapse;font-size:12px;width:max-content;min-width:100%}
  .att-table th,.att-table td{border:1px solid #d0d5dd;padding:0;text-align:center;vertical-align:middle}
  .att-table thead th{background:#1f2d3d;color:#fff;padding:6px 4px;font-size:11px;font-weight:600;min-width:28px}
  .att-table thead .att-sticky{position:sticky;left:0;z-index:3;background:#1f2d3d;color:#fff;padding:6px 10px;text-align:left;min-width:180px}
  .att-table thead .att-num{position:sticky;left:0;z-index:3;background:#1f2d3d;color:#fff;padding:6px 4px;min-width:30px;text-align:center}
  
  .att-table .student-name{position:sticky;left:30px;z-index:1;text-align:left;padding:4px 10px;white-space:nowrap;font-size:12px;min-width:180px;background:#fafbfc}
  .att-table .num-col{position:sticky;left:0;z-index:1;min-width:30px;padding:4px;background:#fafbfc;font-weight:600;color:#6b7685;text-align:center}
  
  .att-cell{width:28px;min-width:28px;height:26px;padding:0;cursor:pointer;position:relative}
  .att-cell:hover{background:#eaf2fb}
  .att-cell .att-val{font-size:11px;font-weight:600;padding:2px;display:block;width:100%;height:100%;line-height:22px}
  .att-cell input.att-input{width:100%;height:100%;border:none;text-align:center;font-size:11px;font-weight:600;padding:0;background:#fffbeb;outline:2px solid #f39c12}
  
  .att-N{background:#fee2e2 !important;color:#991b1b !important;font-weight:700;}
  .att-B{background:#dbeafe !important;color:#1e40af !important;font-weight:700;}
  .att-P{background:#ffedd5 !important;color:#9a3412 !important;font-weight:700;}

  .legend{margin-top:15px;display:flex;gap:15px;font-size:12px;color:#6b7685}
  .legend-item{display:flex;align-items:center;gap:5px}
  .legend-box{width:15px;height:15px;border-radius:3px;border:1px solid #ddd}

  .profile-card{background:#fff;border:1px solid #e2e6ec;border-radius:6px;padding:30px;max-width:500px}
  .profile-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #f1f3f6;font-size:14px}
  .profile-row:last-child{border-bottom:none}
  .profile-row span:first-child{color:#6b7685}.profile-row span:last-child{color:#1f2d3d;font-weight:500}
  .btn-logout{display:inline-block;margin-top:20px;padding:10px 22px;background:#c0392b;color:#fff;border-radius:5px;cursor:pointer;font-size:14px;text-decoration:none}
  .btn-logout:hover{background:#a93226}

  /* Моё расписание учителю */
  .my-schedule-table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border:1px solid #e2e6ec}
  .my-schedule-table th{background:#1f2d3d;color:#fff;padding:12px;text-align:center;font-size:13px}
  .my-schedule-table td{padding:12px;border:1px solid #e2e6ec;text-align:center;vertical-align:middle}
  .my-schedule-table .slot-empty{color:#ccc;font-style:italic}
  .my-schedule-table .slot-filled{background:#f0fdf4;color:#166534;font-weight:600}
  .my-schedule-table .slot-info{font-size:11px;color:#6b7685;margin-top:4px;font-weight:normal}

  @media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}.grid-2{grid-template-columns:1fr}.page-head{flex-direction:column;gap:15px}.assign-form,.journal-filters,.attendance-filters{flex-direction:column}.schedule-select{flex-direction:column}.planning-fields{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- Экран загрузки -->
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <div class="loading-text">Подключение к серверу...</div>
</div>

<div class="login-wrap" id="loginScreen" style="display:none;">
  <div class="login-box">
    <h1>Добро пожаловать в ЭЖ "Зебра"</h1>
    <div class="ver">v1.0 (Cloud Sync)</div>
    <form id="loginForm">
      <div class="field">
        <label for="login">Введите логин*</label>
        <input type="text" id="login" autocomplete="off">
      </div>
      <div class="field">
        <label for="password">Введите пароль*</label>
        <input type="password" id="password">
      </div>
      <a href="#" id="loginBtn" class="btn-login">Войти в систему</a>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>
</div>

<div class="app" id="app">
  <nav class="navbar">
    <div class="brand">
      <div class="t">ЭЖ "Зебра"</div>
      <div class="d">Облачный журнал</div>
    </div>
    <ul class="nav-menu" id="mainNavMenu"></ul>
    <a href="#" class="profile-link" id="profileLink">
      <div class="avatar" id="avatar">Г</div>
      <span>Профиль</span>
    </a>
  </nav>
  <div class="content" id="content"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">Добавить</h2>
      <a href="#" class="modal-close" id="modalClose">×</a>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot">
      <a href="#" class="btn-cancel" id="modalCancel">Отмена</a>
      <a href="#" class="btn-save" id="modalSave">Добавить</a>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';

  // ==========================================
  // 🔥 FIREBASE CONFIGURATION (YOUR KEYS)
  // ==========================================
  const firebaseConfig = {
    apiKey: "AIzaSyCkDLlyisW_ohRWeveLpDP2igB_1lmzaiU",
    authDomain: "ej-zebra.firebaseapp.com",
    projectId: "ej-zebra",
    storageBucket: "ej-zebra.firebasestorage.app",
    messagingSenderId: "854401616216",
    appId: "1:854401616216:web:08e2835567e8dc7496bd2d",
    measurementId: "G-7EE8SK43XQ",
    // ВАЖНО: Добавлено автоматически для совместимости с кодом
    databaseURL: "https://ej-zebra-default-rtdb.firebaseio.com" 
  };

  let db;
  let isFirebaseReady = false;

  // Инициализация Firebase
  try {
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    db = firebase.database();
    
    // Проверка подключения
    const connectedRef = db.ref(".info/connected");
    connectedRef.on("value", (snap) => {
      if (snap.val() === true) {
        console.log("✅ Firebase Connected");
        isFirebaseReady = true;
        initAppLogic();
      } else {
        console.warn("⚠️ Firebase Disconnected");
        isFirebaseReady = false;
      }
    });
  } catch (e) {
    console.error("❌ Firebase Init Error:", e);
    document.getElementById('loadingScreen').innerHTML = '<div class="error-msg" style="color:red;font-size:16px;text-align:center;padding:20px;">Ошибка инициализации Firebase.<br>Проверьте настройки в коде.</div>';
  }

  // Глобальное состояние данных (кэш для быстрого доступа)
  let DATA = {
    employees: [],
    students: [],
    classes: [],
    years: [],
    subjects: [],
    lessonTypes: [],
    load: [],
    bells: [],
    schedule: {},
    grades: {},
    journalTypes: {},
    finalGrades: {},
    planning: {},
    attendance: {}
  };

  var currentUser = null;

  function initAppLogic() {
    // Слушаем изменения всех узлов в базе данных
    const rootRef = db.ref('/');
    
    rootRef.on('value', (snapshot) => {
      const val = snapshot.val();
      if (val) {
        // Обновляем локальный кэш данными из Firebase
        DATA.employees = val.employees || [];
        DATA.students = val.students || [];
        DATA.classes = val.classes || [];
        DATA.years = val.years || [];
        DATA.subjects = val.subjects || [];
        DATA.lessonTypes = val.lessonTypes || [];
        DATA.load = val.load || [];
        DATA.bells = val.bells || [];
        DATA.schedule = val.schedule || {};
        DATA.grades = val.grades || {};
        DATA.journalTypes = val.journalTypes || {};
        DATA.finalGrades = val.finalGrades || {};
        DATA.planning = val.planning || {};
        DATA.attendance = val.attendance || {};
        
        // Если пользователь залогинен, перерисовываем текущую страницу
        if (currentUser && localStorage.getItem('zebra_session')) {
           renderPage(localStorage.getItem('zebra_last_page') || 'home');
        }
      }
      
      hideLoadingAndShowLoginOrApp();
    }, (error) => {
      console.error("Database Read Error:", error);
      document.getElementById('loadingScreen').innerHTML = '<div class="error-msg" style="color:red;font-size:16px;text-align:center;padding:20px;">Ошибка чтения базы данных:<br>'+error.message+'</div>';
    });
  }

  function hideLoadingAndShowLoginOrApp() {
    const loader = document.getElementById('loadingScreen');
    const login = document.getElementById('loginScreen');
    const app = document.getElementById('app');
    
    if (loader) loader.style.display = 'none';
    
    if (currentUser) {
      if (login) login.style.display = 'none';
      if (app) app.classList.add('active');
    } else {
      if (login) login.style.display = 'flex';
      if (app) app.classList.remove('active');
    }
  }

  // Helper to update specific node in Firebase
  function updateNode(path, value) {
    if (!db) return Promise.reject(new Error("No DB"));
    return db.ref(path).set(value);
  }

  function pushToNode(path, item) {
    if (!db) return Promise.reject(new Error("No DB"));
    const newItem = {...item, id: Date.now()}; // Generate ID locally first for consistency
    return db.ref(path).push(newItem).then(() => newItem.id);
  }

  // Getters (Read from local cache DATA which syncs with FB)
  function getE(){return DATA.employees;}
  function getSt(){return DATA.students;}
  function getCl(){return DATA.classes;}
  function getYr(){return DATA.years;}
  function getSbj(){return DATA.subjects;}
  function getLT(){return DATA.lessonTypes;}
  function getLoad(){return DATA.load;}
  function getBells(){return DATA.bells;}
  function getSchedule(){return DATA.schedule;}
  function getGrades(){return DATA.grades;}
  function getJTypes(){return DATA.journalTypes;}
  function getFinals(){return DATA.finalGrades;}
  function getPlanning(){return DATA.planning;}
  function getAttendance(){return DATA.attendance;}

  // Utils
  function norm(s){return s.trim().replace(/\s+/g,' ').toLowerCase();}
  function fmtD(iso){return iso?new Date(iso).toLocaleString('ru-RU'):'—';}
  function fmtN(n){return n.toFixed(2).replace('.',',');}
  function empName(id){var e=getE();for(var i=0;i<e.length;i++)if(e[i].id===id)return e[i].fio;return '—';}
  function clsName(id){var c=getCl();for(var i=0;i<c.length;i++)if(c[i].id===id)return c[i].number+c[i].letter;return '—';}
  function sbjName(id){var s=getSbj();for(var i=0;i<s.length;i++)if(s[i].id===id)return s[i].fullName;return '—';}
  function ltName(id){var l=getLT();for(var i=0;i<l.length;i++)if(l[i].id==id)return l[i].shortName;return '';}
  function ltColor(id){var l=getLT();for(var i=0;i<l.length;i++)if(l[i].id==id)return l[i].color;return '#ccc';}

  var DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
  var MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];

  function getCurrentUserSession() {
    var s = JSON.parse(localStorage.getItem('zebra_session') || '{}');
    return s.employeeId ? s : null;
  }

  function isTeacher(role) { return role === 'Учитель'; }
  function isAdminOrDeputy(role) { return role === 'Директор' || role === 'Завуч'; }

  function doLogin(){
    var lv=norm(document.getElementById('login').value),pv=document.getElementById('password').value,err=document.getElementById('errorMsg');
    if(!lv||!pv){err.textContent='Введите логин и пароль';return;}
    
    var emps=getE(), found=null;
    for(var i=0;i<emps.length;i++){
      if(norm(emps[i].login)===lv && emps[i].password===pv){found=emps[i];break;}
    }
    
    if(!found){
      var sts=getSt();
      for(var j=0;j<sts.length;j++){
        if(norm(sts[j].login)===lv && sts[j].password===pv){found=sts[j];found._type='student';break;}
      }
    }
    
    if(found){
      // Update lastLogin in Firebase
      if(db){
         db.ref((found._type==='student'?'students':'employees')+'/'+found.id+'/lastLogin').set(new Date().toISOString());
      }
      
      var sessionData = {employeeId:found.id,login:found.login,name:found.fio,role:found.role||'Ученик',time:new Date().toISOString()};
      localStorage.setItem('zebra_session',JSON.stringify(sessionData));
      currentUser = sessionData;
      showApp();
    }else{err.textContent='Неверный логин или пароль';}
  }

  function buildMenu(role) {
    var menuHtml = '';
    menuHtml += '<li><a href="#" data-page="home">Главная</a></li>';

    if (isAdminOrDeputy(role)) {
      menuHtml += `
        <li>
          <a href="#">Пользователи <span class="arrow">▼</span></a>
          <ul class="dropdown">
            <li><a href="#" data-page="employees">Сотрудники</a></li>
            <li><a href="#" data-page="students">Ученики</a></li>
          </ul>
        </li>
        <li>
          <a href="#">Учебный процесс <span class="arrow">▼</span></a>
          <ul class="dropdown">
            <li><a href="#" data-page="year">Учебный год и периоды</a></li>
            <li><a href="#" data-page="classes">Классы</a></li>
            <li><a href="#" data-page="subjects">Предметы</a></li>
            <li><a href="#" data-page="lesson-types">Типы уроков</a></li>
            <li><a href="#" data-page="load">Нагрузка учителей</a></li>
            <li><a href="#" data-page="bells">Звонки</a></li>
            <li><a href="#" data-page="lessons-by-class">Уроки по классам</a></li>
          </ul>
        </li>
        <li>
          <a href="#">Журналы <span class="arrow">▼</span></a>
          <ul class="dropdown">
            <li><a href="#" data-page="class-journal">Классный журнал</a></li>
            <li><a href="#" data-page="attendance">Журнал посещаемости</a></li>
          </ul>
        </li>
      `;
    } else if (isTeacher(role)) {
      menuHtml += `
        <li><a href="#" data-page="my-schedule">Моё расписание</a></li>
        <li>
          <a href="#">Журналы <span class="arrow">▼</span></a>
          <ul class="dropdown">
            <li><a href="#" data-page="class-journal">Классный журнал</a></li>
            <li><a href="#" data-page="attendance">Журнал посещаемости</a></li>
          </ul>
        </li>
      `;
    }
    
    document.getElementById('mainNavMenu').innerHTML = menuHtml;
    bindMenuEvents();
  }

  function showApp(){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').classList.add('active');
    
    var s = getCurrentUserSession();
    if (!s) { location.reload(); return; }
    
    currentUser = s;
    document.getElementById('avatar').textContent=(s.name||'?')[0];
    
    buildMenu(s.role);
    
    var defaultPage = isTeacher(s.role) ? 'my-schedule' : 'home';
    renderPage(defaultPage);
  }

  function bindMenuEvents() {
    document.querySelectorAll('.nav-menu > li > a').forEach(function(a){
      a.addEventListener('click',function(e){
        e.preventDefault();var li=a.parentElement;
        if(a.dataset.page){renderPage(a.dataset.page);}
        else if(li.querySelector('.dropdown')){document.querySelectorAll('.nav-menu > li').forEach(function(el){if(el!==li)el.classList.remove('open');});li.classList.toggle('open');}
      });
    });
    document.querySelectorAll('.dropdown a').forEach(function(a){
      a.addEventListener('click',function(e){e.preventDefault();e.stopPropagation();renderPage(a.dataset.page);document.querySelectorAll('.nav-menu > li').forEach(function(el){el.classList.remove('open');});});
    });
  }

  // --- RENDER PAGES (Same logic, but saving goes to Firebase) ---

  function renderHome(){
    var stats = calculateStudentStats();
    var best = stats.filter(x => x.avg > 0).sort((a,b)=>b.avg-a.avg).slice(0,5);
    var absent = stats.filter(x => x.absences > 0).sort((a,b)=>b.absences-a.absences).slice(0,5);

    var h='<h1 class="page-title">Добро пожаловать, '+currentUser.name+'!</h1>';
    h+='<p class="page-sub">Текущая роль: <b>'+currentUser.role+'</b></p>';
    
    h+='<div class="stats-grid">';
    h+='<div class="stat-card c1"><div class="stat-num">'+getE().length+'</div><div class="stat-label">Всего сотрудников</div></div>';
    h+='<div class="stat-card c2"><div class="stat-num">'+getSt().length+'</div><div class="stat-label">Всего учеников</div></div>';
    h+='<div class="stat-card c3"><div class="stat-num">'+getCl().length+'</div><div class="stat-label">Всего классов</div></div>';
    h+='<div class="stat-card c4"><div class="stat-num">'+getSbj().length+'</div><div class="stat-label">Всего предметов</div></div></div>';
    
    h+='<div class="grid-2"><div><div class="section-title">🏆 Лучшие ученики школы</div>';
    if(best.length===0){h+='<div class="card"><p class="muted">Нет данных.</p></div>';}
    else{
      h+='<table><thead><tr><th>№</th><th>ФИО</th><th>Класс</th><th>Средний балл</th></tr></thead><tbody>';
      best.forEach(function(x,i){h+='<tr><td>'+(i+1)+'</td><td>'+x.fio+'</td><td>'+x.cls+'</td><td><span class="badge badge-green">'+fmtN(x.avg)+'</span></td></tr>';});
      h+='</tbody></table>';
    }
    h+='</div><div><div class="section-title">⚠️ Ученики с пропусками</div>';
    if(absent.length===0){h+='<div class="card"><p class="muted">Нет данных.</p></div>';}
    else{
      h+='<table><thead><tr><th>№</th><th>ФИО</th><th>Класс</th><th>Пропущено дней</th></tr></thead><tbody>';
      absent.forEach(function(x,i){h+='<tr><td>'+(i+1)+'</td><td>'+x.fio+'</td><td>'+x.cls+'</td><td><span class="badge badge-red">'+x.absences+'</span></td></tr>';});
      h+='</tbody></table>';
    }
    h+='</div></div>';
    return h;
  }

  function renderMySchedule() {
    var myLoads = getLoad().filter(l => l.teacherId === currentUser.employeeId);
    var bells = getBells();
    
    if (myLoads.length === 0) {
      return '<div class="card"><p class="muted">Вам не назначена нагрузка. Обратитесь к администратору.</p></div>';
    }

    var h = '<h1 class="page-title">Моё расписание</h1>';
    h += '<p class="page-sub">Ваши занятия на текущую неделю</p>';
    
    if (bells.length === 0) {
       return h + '<div class="card"><p class="muted">Расписание звонков не настроено.</p></div>';
    }

    h += '<table class="my-schedule-table"><thead><tr><th>Урок / Время</th>';
    DAYS.forEach(d => h += '<th>'+d+'</th>');
    h += '</tr></thead><tbody>';

    bells.forEach((bell, bi) => {
      h += '<tr><td style="font-weight:700;color:#1f2d3d">'+(bi+1)+'<br><small style="color:#6b7685;font-weight:normal">'+bell.start+' – '+bell.end+'</small></td>';
      
      DAYS.forEach((day, di) => {
        let lessonInfo = null;
        myLoads.forEach(load => {
           const classKey = 'c' + load.classId;
           const sched = getSchedule()[classKey];
           if (!sched) return;
           
           let periodData = null;
           for(let p in sched) {
             if(p !== '_draft' && typeof sched[p] === 'object') {
               periodData = sched[p];
               break;
             }
           }
           if(!periodData && sched._draft) periodData = sched._draft;
           if(!periodData) return;

           const cellKey = di + '_' + bi;
           if(periodData[cellKey] && periodData[cellKey].subj == load.subjectId) {
              lessonInfo = {
                className: clsName(load.classId),
                subjectName: sbjName(load.subjectId)
              };
           }
        });

        if (lessonInfo) {
          h += '<td class="slot-filled">' + lessonInfo.className + '<div class="slot-info">' + lessonInfo.subjectName + '</div></td>';
        } else {
          h += '<td class="slot-empty">—</td>';
        }
      });
      h += '</tr>';
    });
    h += '</tbody></table>';
    return h;
  }

  function renderEmployees(){
    var emps=getE(),h='<div class="page-head"><div class="page-head-left"><h1 class="page-title">Сотрудники</h1><p class="page-sub">Управление учётными записями сотрудников школы</p></div>';
    h+='<a href="#" class="add-link" data-action="add-employee">＋ Добавить сотрудника</a></div>';
    h+='<table><thead><tr><th>№</th><th>ФИО сотрудника</th><th>Роль</th><th>Последний вход</th><th>Логин</th><th>Пароль</th><th>Действия</th></tr></thead><tbody>';
    if(emps.length===0){h+='<tr class="empty-row"><td colspan="7">Сотрудники не добавлены</td></tr>';}
    else{
      emps.forEach(function(e,i){
        var act=e.role==='Директор'?'<span class="muted">—</span>':'<a href="#" class="act-link act-edit" data-action="edit-employee" data-id="'+e.id+'">Редактировать</a><a href="#" class="act-link act-del" data-action="delete-employee" data-id="'+e.id+'">Удалить</a>';
        h+='<tr><td>'+(i+1)+'</td><td>'+e.fio+'</td><td>'+e.role+'</td><td>'+fmtD(e.lastLogin)+'</td><td>'+e.login+'</td><td>'+e.password+'</td><td>'+act+'</td></tr>';
      });
    }
    return h+'</tbody></table>';
  }

  function renderStudents(){
    var sts=getSt(),h='<div class="page-head"><div class="page-head-left"><h1 class="page-title">Ученики</h1><p class="page-sub">Управление учётными записями учеников</p></div>';
    h+='<a href="#" class="add-link" data-action="add-student">＋ Добавить ученика</a></div>';
    h+='<table><thead><tr><th>№</th><th>ФИО ученика</th><th>Класс</th><th>Последний вход</th><th>Логин</th><th>Пароль</th><th>Действия</th></tr></thead><tbody>';
    if(sts.length===0){h+='<tr class="empty-row"><td colspan="7">Ученики не добавлены</td></tr>';}
    else{
      sts.forEach(function(s,i){
        h+='<tr><td>'+(i+1)+'</td><td>'+s.fio+'</td><td>'+s.cls+'</td><td>'+fmtD(s.lastLogin)+'</td><td>'+s.login+'</td><td>'+s.password+'</td><td>';
        h+='<a href="#" class="act-link act-edit" data-action="edit-student" data-id="'+s.id+'">Редактировать</a>';
        h+='<a href="#" class="act-link act-del" data-action="delete-student" data-id="'+s.id+'">Удалить</a></td></tr>';
      });
    }
    return h+'</tbody></table>';
  }

  function renderYears(){
    var yrs=getYr(),h='<div class="page-head"><div class="page-head-left"><h1 class="page-title">Учебный год и периоды</h1><p class="page-sub">Управление учебными годами и периодами</p></div>';
    h+='<a href="#" class="add-link" data-action="add-year">＋ Добавить учебный год</a></div>';
    h+='<table><thead><tr><th>№</th><th>Учебный год</th><th>Начало периода</th><th>Конец периода</th><th>Действия</th></tr></thead><tbody>';
    if(yrs.length===0){h+='<tr class="empty-row"><td colspan="5">Учебные годы не добавлены</td></tr>';}
    else{
      yrs.forEach(function(y,yi){
        if(!y.periods||y.periods.length===0){
          h+='<tr><td>'+(yi+1)+'</td><td>'+y.name+'</td><td colspan="2" class="muted">Периоды не заданы</td><td>';
          h+='<a href="#" class="act-link act-edit" data-action="edit-year" data-id="'+y.id+'">Редактировать</a>';
          h+='<a href="#" class="act-link act-del" data-action="delete-year" data-id="'+y.id+'">Удалить</a></td></tr>';
        } else {
          y.periods.forEach(function(p,pi){
            h+='<tr>';
            if(pi===0){h+='<td rowspan="'+y.periods.length+'">'+(yi+1)+'</td><td rowspan="'+y.periods.length+'">'+y.name+'</td>';}
            h+='<td>'+p.start+'</td><td>'+p.end+'</td>';
            if(pi===0){
              h+='<td rowspan="'+y.periods.length+'">';
              h+='<a href="#" class="act-link act-edit" data-action="edit-year" data-id="'+y.id+'">Редактировать</a>';
              h+='<a href="#" class="act-link act-del" data-action="delete-year" data-id="'+y.id+'">Удалить</a></td>';
            }
            h+='</tr>';
          });
        }
      });
    }
    return h+'</tbody></table>';
  }

  function renderClasses(){
    var cls=getCl(),h='<div class="page-head"><div class="page-head-left"><h1 class="page-title">Классы</h1><p class="page-sub">Управление классами школы</p></div>';

  var journalState={classId:null,subjectId:null,periodId:null,dates:[]};

  function generateDatesForPeriod(periodId){
    var yrs=getYr(),startDate=null,endDate=null;
    yrs.forEach(function(y){if(y.periods)y.periods.forEach(function(p,pi){if(y.id+'_'+pi===periodId){startDate=new Date(p.start);endDate=new Date(p.end);}});});
    if(!startDate||!endDate)return [];
    
    var schedule=getSchedule(),clsId=journalState.classId,classKey='c'+clsId;
    var classData=schedule[classKey];
    var periodData=classData?(classData[periodId]||classData._draft||{}):{};
    var lessonDays=[];
    for(var key in periodData){
      if(periodData[key].subj==journalState.subjectId){
        var parts=key.split('_');
        lessonDays.push(parseInt(parts[0],10));
      }
    }
    if(lessonDays.length===0){
      for(var d=0;d<6;d++)lessonDays.push(d);
    }
    
    var dates=[],cur=new Date(startDate);
    while(cur<=endDate){
      var dow=cur.getDay();
      var mappedDow=dow===0?6:dow-1;
      if(lessonDays.indexOf(mappedDow)!==-1){
        dates.push(cur.toISOString().split('T')[0]);
      }
      cur.setDate(cur.getDate()+1);
    }
    return dates;
  }

  function parseGrade(val){
    if(!val||val==='')return null;
    val=val.toUpperCase().trim();
    if(['Н','Б','П','ЗЧ','НЗ'].indexOf(val)!==-1)return {type:'mark',val:val,num:false};
    if(val.indexOf('/')!==-1){
      var parts=val.split('/'),nums=[];
      for(var i=0;i<parts.length;i++){var n=parseInt(parts[i],10);if(n>=2&&n<=5)nums.push(n);}
      if(nums.length>0)return {type:'double',val:val,nums:nums,num:true};
      return null;
    }
    var num=parseInt(val,10);
    if(num>=2&&num<=5)return {type:'single',val:String(num),nums:[num],num:true};
    return null;
  }

  function calcAvg(studentId,gKey){
    var grades=getGrades();
    var row=grades[gKey]?grades[gKey][studentId]:null;
    if(!row)return null;
    var sum=0,cnt=0;
    journalState.dates.forEach(function(d){
      var v=row[d];
      if(v){var p=parseGrade(v);if(p&&p.num)p.nums.forEach(function(n){sum+=n;cnt++;});}
    });
    return cnt>0?sum/cnt:null;
  }

  function calculateStudentStats() {
    var students = getSt();
    var gradesAll = getGrades(); 
    var attendanceAll = getAttendance(); 
    
    var results = [];

    students.forEach(function(stu) {
      var totalSum = 0;
      var totalCount = 0;
      var absenceCount = 0;

      for (var key in gradesAll) {
        var parts = key.split('_');
        var classId = parseInt(parts[0], 10);
        
        var stuClassObj = null;
        var allClasses = getCl();
        for(var ci=0; ci<allClasses.length; ci++){
           if(allClasses[ci].number + allClasses[ci].letter === stu.cls){
             stuClassObj = allClasses[ci];
             break;
           }
        }
        
        if (!stuClassObj || stuClassObj.id !== classId) continue;

        var studentGrades = gradesAll[key][stu.id] || {};
        for (var date in studentGrades) {
          var val = studentGrades[date];
          if (!val) continue;
          
          var parsed = parseGrade(val);
          if (parsed && parsed.num) {
            parsed.nums.forEach(function(n) {
              totalSum += n;
              totalCount++;
            });
          } else if (['Н','Б','П'].indexOf(parsed ? parsed.val : '') !== -1) {
             absenceCount++; 
          }
        }
      }

      var stuClassId = stuClassObj ? stuClassObj.id : null;
      if (stuClassId) {
         for (var attKey in attendanceAll) {
            if (attKey.startsWith('att_' + stuClassId + '_')) {
               var marks = attendanceAll[attKey];
               if (marks && marks[stu.id]) {
                  var m = marks[stu.id];
                  if (['Н','Б','П'].indexOf(m) !== -1) {
                     let alreadyCounted = false;
                     for (var gKey in gradesAll) {
                        if (gKey.startsWith(stuClassId + '_')) {
                           var sGrades = gradesAll[gKey][stu.id] || {};
                           var attDate = attKey.substring(attKey.lastIndexOf('_') + 1);
                           
                           if (sGrades[attDate]) {
                              var p = parseGrade(sGrades[attDate]);
                              if (p && ['Н','Б','П'].indexOf(p.val) !== -1) {
                                 alreadyCounted = true;
                                 break;
                              }
                           }
                        }
                     }
                     if (!alreadyCounted) {
                        absenceCount++;
                     }
                  }
               }
            }
         }
      }

      var avg = totalCount > 0 ? totalSum / totalCount : 0;
      
      results.push({
        fio: stu.fio,
        cls: stu.cls,
        avg: avg,
        absences: absenceCount
      });
    });

    return results;
  }

  function modalSubject(id){var s=id?getSbj().find(function(x){return x.id===id;}):null;var h='<div class="field"><label>Введите полное наименование предмета*</label><input type="text" id="mFullName" value="'+(s?s.fullName:'')+'" placeholder="Например: Математика"></div>';h+='<div class="field"><label>Введите краткое наименование предмета*</label><input type="text" id="mShortName" value="'+(s?s.shortName:'')+'" placeholder="Например: Мат"></div>';openModal(id?'Редактировать предмет':'Добавить предмет',h,id?'Сохранить':'Добавить предмет','subject',id);}
  function saveSubject(){
    var fn=document.getElementById('mFullName').value.trim(),sn=document.getElementById('mShortName').value.trim();
    if(!fn)return mErr('Введите полное наименование');if(!sn)return mErr('Введите краткое наименование');
    
    var newData = {fullName:fn,shortName:sn};
    
    if(editingId){
      Object.assign(newData, {id: editingId});
      updateNode('/subjects/'+editingId, newData).then(()=>{
        clearDraft();closeModal(true);renderPage('subjects');
      }).catch(err=>mErr('Ошибка: '+err.message));
    }else{
      pushToNode('/subjects', newData).then(()=>{
        clearDraft();closeModal(true);renderPage('subjects');
      }).catch(err=>mErr('Ошибка: '+err.message));
    }
  }
  function deleteSubject(id){
    if(!confirm('Удалить предмет?'))return;
    updateNode('/subjects/'+id, null).then(()=>renderPage('subjects')).catch(alert);
  }

  function modalLT(id){var t=id?getLT().find(function(x){return x.id===id;}):null;var h='<div class="field"><label>Введите полное наименование типа*</label><input type="text" id="mFullName" value="'+(t?t.fullName:'')+'" placeholder="Например: Контрольная работа"></div>';h+='<div class="field"><label>Введите краткое наименование типа*</label><input type="text" id="mShortName" value="'+(t?t.shortName:'')+'" placeholder="Например: КР"></div>';h+='<div class="field"><label>Выберите цвет типа*</label><input type="color" id="mColor" value="'+(t?t.color:'#3498db')+'"></div>';openModal(id?'Редактировать тип урока':'Добавить тип урока',h,id?'Сохранить':'Добавить','lt',id);}
  function saveLT(){
    var fn=document.getElementById('mFullName').value.trim(),sn=document.getElementById('mShortName').value.trim(),cl=document.getElementById('mColor').value;
    if(!fn)return mErr('Введите полное наименование');if(!sn)return mErr('Введите краткое наименование');if(!cl)return mErr('Выберите цвет');
    
    var newData = {fullName:fn,shortName:sn,color:cl};
    
    if(editingId){
      Object.assign(newData, {id: editingId});
      updateNode('/lessonTypes/'+editingId, newData).then(()=>{
        clearDraft();closeModal(true);renderPage('lesson-types');
      }).catch(err=>mErr('Ошибка: '+err.message));
    }else{
      pushToNode('/lessonTypes', newData).then(()=>{
        clearDraft();closeModal(true);renderPage('lesson-types');
      }).catch(err=>mErr('Ошибка: '+err.message));
    }
  }
  function deleteLT(id){
    if(!confirm('Удалить тип урока?'))return;
    updateNode('/lessonTypes/'+id, null).then(()=>renderPage('lesson-types')).catch(alert);
  }

  function assignLoad(){
    var cid=parseInt(document.getElementById('loadCls').value,10),sid=parseInt(document.getElementById('loadSbj').value,10),tid=parseInt(document.getElementById('loadTeacher').value,10);
    if(!cid||isNaN(cid))return alert('Выберите класс');if(!sid||isNaN(sid))return alert('Выберите предмет');if(!tid||isNaN(tid))return alert('Выберите учителя');
    
    var load=getLoad();
    for(var i=0;i<load.length;i++)if(load[i].classId===cid&&load[i].subjectId===sid&&load[i].teacherId===tid)return alert('Такая нагрузка уже назначена');
    
    pushToNode('/load', {classId:cid,subjectId:sid,teacherId:tid}).then(()=>{
      renderPage('load');
    }).catch(alert);
  }
  function deleteLoad(id){
    if(!confirm('Удалить назначение?'))return;
    updateNode('/load/'+id, null).then(()=>renderPage('load')).catch(alert);
  }

  /* ===== ДЕЛЕГИРОВАНИЕ ===== */
  document.getElementById('content').addEventListener('click',function(e){
    var t=e.target.closest('[data-action]');
    if(t){
      e.preventDefault();
      var a=t.getAttribute('data-action'),id=parseInt(t.getAttribute('data-id'),10);
      
      if (isTeacher(currentUser.role)) {
         var teacherActions = ['open-journal','go-planning','back-to-journal','open-attendance','edit-grade','edit-final','edit-att','logout'];
         if (!teacherActions.includes(a)) return; 
      }

      if(a==='add-employee')modalEmployee();
      else if(a==='edit-employee')modalEmployee(id);
      else if(a==='delete-employee')deleteEmployee(id);
      else if(a==='add-student')modalStudent();
      else if(a==='edit-student')modalStudent(id);
      else if(a==='delete-student')deleteStudent(id);
      else if(a==='add-year')modalYear();
      else if(a==='edit-year')modalYear(id);
      else if(a==='delete-year')deleteYear(id);
      else if(a==='add-class')modalClass();
      else if(a==='edit-class')modalClass(id);
      else if(a==='delete-class')deleteClass(id);
      else if(a==='add-subject')modalSubject();
      else if(a==='edit-subject')modalSubject(id);
      else if(a==='delete-subject')deleteSubject(id);
      else if(a==='add-lt')modalLT();
      else if(a==='edit-lt')modalLT(id);
      else if(a==='delete-lt')deleteLT(id);
      else if(a==='assign-load')assignLoad();
      else if(a==='delete-load')deleteLoad(id);
      else if(a==='add-bell')addBellRow();
      else if(a==='remove-bell'){var row=t.closest('.bell-row');if(row){row.remove();renumberBells();}}
      else if(a==='save-bells')saveBells();
      else if(a==='open-publish')openPublishModal();
      else if(a==='open-journal'){
        journalState.classId=parseInt(document.getElementById('jClass').value,10)||null;
        journalState.subjectId=parseInt(document.getElementById('jSubject').value,10)||null;
        journalState.periodId=document.getElementById('jPeriod').value||null;
        if(journalState.classId&&journalState.subjectId&&journalState.periodId){
          journalState.dates=generateDatesForPeriod(journalState.periodId);
        }
        renderPage('class-journal');
      }
      else if(a==='go-planning'){
        renderPage('planning');
      }
      else if(a==='back-to-journal'){
        renderPage('class-journal');
      }
      else if(a==='open-attendance'){
        attState.classId=parseInt(document.getElementById('attClass').value,10)||null;
        attState.month=parseInt(document.getElementById('attMonth').value,10);
        attState.year=parseInt(document.getElementById('attYear').value,10);
        renderPage('attendance');
      }
      else if(a==='logout'){
        localStorage.removeItem('zebra_session');
        localStorage.removeItem('zebra_last_page');
        location.reload();
      }
    }

    var jt=e.target.closest('[data-action-j]');
    if(jt){
      e.preventDefault();
      var ja=jt.getAttribute('data-action-j');
      if(ja==='edit-grade')editGradeCell(jt);
      else if(ja==='edit-final')editFinalCell(jt);
    }
    
    var at=e.target.closest('[data-action-a]');
    if(at){
      e.preventDefault();
      if(at.getAttribute('data-action-a')==='edit-att')editAttCell(at);
    }
  });

  document.getElementById('content').addEventListener('input',function(e){
    if(e.target.hasAttribute('data-plan-field')){
      savePlanningField(e.target);
    }
  });
  document.getElementById('content').addEventListener('change',function(e){
    if(e.target.hasAttribute('data-plan-field')){
      savePlanningField(e.target);
      if(e.target.getAttribute('data-plan-field')==='type'){
         renderPage('planning'); 
      }
    }
    if(e.target.id==='scheduleClassSelect'){selectedClassId=parseInt(e.target.value,10)||null;renderPage('lessons-by-class');}
  });

  function editGradeCell(td){
    var sid=td.getAttribute('data-student'),dt=td.getAttribute('data-date');
    var span=td.querySelector('.grade-val'),curVal=span?span.textContent:'';
    var inp=document.createElement('input');
    inp.type='text';inp.className='grade-input';inp.value=curVal;
    inp.setAttribute('data-student',sid);inp.setAttribute('data-date',dt);
    td.innerHTML='';td.appendChild(inp);inp.focus();inp.select();
    
    inp.addEventListener('blur',function(){saveGradeInput(this);});
    inp.addEventListener('keydown',function(ev){
      if(ev.key==='Enter'){ev.preventDefault();this.blur();}
      if(ev.key==='Escape'){renderPage('class-journal');}
    });
  }

  function saveGradeInput(inp){
    var sid=inp.getAttribute('data-student'),dt=inp.getAttribute('data-date'),val=inp.value.trim().toUpperCase();
    if(val!==''){
      var parsed=parseGrade(val);
      if(!parsed){alert('Допустимо: 2-5, Н, Б, П, ЗЧ, НЗ, двойные через /');inp.focus();return;}
      val=parsed.val;
    }
    var gKey=journalState.classId+'_'+journalState.subjectId+'_'+journalState.periodId;
    
    // Save to Firebase
    updateNode('/grades/'+gKey+'/'+sid+'/'+dt, val).then(()=>{
      renderPage('class-journal');
      setTimeout(function(){
        var cell=document.querySelector('.grade-cell[data-student="'+sid+'"][data-date="'+dt+'"]');
        if(cell)cell.classList.add('saved-flash');
      },50);
    }).catch(alert);
  }

  function editFinalCell(td){
    var sid=td.getAttribute('data-student');
    var gKey=journalState.classId+'_'+journalState.subjectId+'_'+journalState.periodId;
    var finals=getFinals(),curVal=finals[gKey]?finals[gKey][sid]||'':'';
    var span=td.querySelector('.final-val');
    var inp=document.createElement('input');
    inp.type='text';inp.className='final-input';inp.value=curVal;
    inp.setAttribute('data-student',sid);
    td.innerHTML='';td.appendChild(inp);inp.focus();inp.select();
    
    inp.addEventListener('blur',function(){saveFinalInput(this);});
    inp.addEventListener('keydown',function(ev){
      if(ev.key==='Enter'){ev.preventDefault();this.blur();}
      if(ev.key==='Escape'){renderPage('class-journal');}
    });
  }

  function saveFinalInput(inp){
    var sid=inp.getAttribute('data-student'),val=inp.value.trim().toUpperCase();
    if(val!==''){
      var valid=['2','3','4','5','Н','Б','П','ЗЧ','НЗ'];
      if(valid.indexOf(val)===-1){alert('Итоговая оценка: 2-5, Н, Б, П, ЗЧ, НЗ');inp.focus();return;}
    }
    var gKey=journalState.classId+'_'+journalState.subjectId+'_'+journalState.periodId;
    
    updateNode('/finalGrades/'+gKey+'/'+sid, val).then(()=>{
      renderPage('class-journal');
    }).catch(alert);
  }

  function renumberBells(){var rows=document.querySelectorAll('#bellsContainer .bell-row');rows.forEach(function(r,i){r.querySelector('.bell-num').textContent='Урок '+(i+1);});bellCount=rows.length;}

  document.getElementById('modalBody').addEventListener('click',function(e){
    var t=e.target.closest('[data-action]');
    if(t&&t.getAttribute('data-action')==='remove-period'){e.preventDefault();var row=t.closest('.period-row');if(row){row.remove();saveDraft();}return;}
    if(e.target.id==='btnAddPeriod'||e.target.closest('#btnAddPeriod')){e.preventDefault();addPeriodRow();}
  });
  document.getElementById('modalBody').addEventListener('input',function(){saveDraft();});
  document.getElementById('modalBody').addEventListener('change',function(){saveDraft();});

  document.getElementById('modalSave').addEventListener('click',function(e){
    e.preventDefault();
    if(modalType==='employee')saveEmployee();
    else if(modalType==='student')saveStudent();
    else if(modalType==='year')saveYear();
    else if(modalType==='class')saveClass();
    else if(modalType==='subject')saveSubject();
    else if(modalType==='lt')saveLT();
    else if(modalType==='publish')publishSchedule();
  });
  document.getElementById('modalCancel').addEventListener('click',function(e){e.preventDefault();closeModal(false);});
  document.getElementById('modalClose').addEventListener('click',function(e){e.preventDefault();closeModal(true);});
  document.getElementById('modalOverlay').addEventListener('click',function(e){if(e.target===this)closeModal(true);});

  document.getElementById('loginBtn').addEventListener('click',function(e){e.preventDefault();doLogin();});
  document.getElementById('loginForm').addEventListener('submit',function(e){e.preventDefault();doLogin();});

  document.getElementById('profileLink').addEventListener('click',function(e){e.preventDefault();renderPage('profile');});
  document.addEventListener('click',function(e){if(!e.target.closest('.nav-menu'))document.querySelectorAll('.nav-menu > li').forEach(function(el){el.classList.remove('open');});});

  window.addEventListener('beforeunload',function(){var s=localStorage.getItem('zebra_session');if(s)localStorage.setItem('zebra_session',s);});

  // Initial check for session
  if(localStorage.getItem('zebra_session')){
     currentUser = JSON.parse(localStorage.getItem('zebra_session'));
     // Wait for Firebase connection before showing app
     const checkInterval = setInterval(() => {
       if(isFirebaseReady) {
         clearInterval(checkInterval);
         showApp();
       }
     }, 500);
  } else {
     // Show login screen immediately if no session, even if loading
     setTimeout(() => {
        if(document.getElementById('loadingScreen')) document.getElementById('loadingScreen').style.display='none';
        document.getElementById('loginScreen').style.display='flex';
     }, 1000);
  }

})();
</script>
</body>
